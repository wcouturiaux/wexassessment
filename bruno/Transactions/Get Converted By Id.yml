info:
  name: Get Converted By Id
  type: http
  seq: 3

http:
  method: GET
  url: "{{baseUrl}}/api/v1/transactions/{{transactionId}}/conversions?target_currency=CAD&target_country=CA"
  params:
    - name: target_currency
      value: CAD
      type: query
    - name: target_country
      value: CA
      type: query
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: 200
    - expression: res.body.id
      operator: isString
    - expression: res.body.target_currency
      operator: eq
      value: CAD
