info:
  name: Create Transaction
  type: http
  seq: 1

http:
  method: POST
  url: "{{baseUrl}}/api/v1/transactions"
  body:
    type: json
    data: |-
      {
        "description": "First Creation",
        "transaction_date": "2026-04-01",
        "amount": "30000.00"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: 200
    - expression: res.body.id
      operator: isString
    - expression: res.body.description
      operator: eq
      value: First Creation
  scripts:
    - type: after-response
      code: |-
        const id = res.body.id;
        if (id) {
          bru.setVar('transactionId', id);
        }
