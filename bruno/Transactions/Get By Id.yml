info:
  name: Get By Id
  type: http
  seq: 2

http:
  method: GET
  url: "{{baseUrl}}/api/v1/transactions/{{transactionId}}"
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: 200
    - expression: res.body.id
      operator: isString
    - expression: res.body.description
      operator: isString
