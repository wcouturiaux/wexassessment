info:
  name: Get Converted By Id - Fail (Not Found)
  type: http
  seq: 10

http:
  method: GET
  url: "{{baseUrl}}/api/v1/transactions/:id/conversions?target_currency=CAD&target_country=CA"
  params:
    - name: id
      value: 00000000-0000-0000-0000-000000000000
      type: path
    - name: target_currency
      value: CAD
      type: query
    - name: target_country
      value: CA
      type: query
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: 404
    - expression: res.body.title
      operator: eq
      value: Resource Not Found
