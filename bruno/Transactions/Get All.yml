info:
  name: Get All
  type: http
  seq: 4

http:
  method: GET
  url: "{{baseUrl}}/api/v1/transactions"
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: 200
    - expression: res.body
      operator: isArray
