info:
  name: Create - Fail (Invalid amount)
  type: http
  seq: 5

http:
  method: POST
  url: "{{baseUrl}}/api/v1/transactions"
  body:
    type: json
    data: |-
      {
        "description": "First Creation",
        "transaction_date": "2026-04-01",
        "amount": "-30000.00"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: 400
    - expression: res.body.title
      operator: eq
      value: Validation Failed
