info:
  name: Get All Converted
  type: http
  seq: 1

http:
  method: GET
  url: "{{baseUrl}}/api/v1/transactions/conversions?target_currency=CAD&target_country=CA"
  params:
    - name: target_currency
      value: CAD
      type: query
    - name: target_country
      value: CA
      type: query
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
